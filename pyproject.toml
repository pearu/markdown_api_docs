[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown_api_docs"
requires-python = ">=3.11"
authors = [{name = "Pearu Peterson", email = "pearu.peterson@gmail.com"}]
description = "Generate API documentations from C++ headers using Markdown"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    'Programming Language :: Python :: 3',
    "Topic :: Software Development",
]
dynamic = ["version"]

dependencies = []

[project.optional-dependencies]

test = [
    "pytest",
    "coverage",
    "pytest-mock",
]

dev = [
    "pre-commit",
]

[project.urls]
Home = "https://github.com/pearu/markdown_api_docs"
Source = "https://github.com/pearu/markdown_api_docs"

[tool.setuptools.packages.find]
include = ["markdown_api_docs", "markdown_api_docs.tests"]  # package names should match these glob patterns (["*"] by default)
exclude = [".*", "*~", "*/*~", "*/*/*~", "*/__pycache__", "*/*/__pycache__"]

[tool.black]
line-length = 127
target-version = ["py311", "py312"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-rsx -v"
testpaths = [
    "markdown_api_docs/tests",
]

[tool.setuptools_scm]
version_file = "markdown_api_docs/_version.py"
